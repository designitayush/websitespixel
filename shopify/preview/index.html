<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website wall preview</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#05050A;color:#fff;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .wsp-hero{position:relative;isolation:isolate;display:flex;align-items:center;
    min-height:100vh;padding:7rem 1.5rem 4rem;background:#05050A;overflow:hidden}
  .wsp-hero__inner{position:relative;z-index:1;width:100%;max-width:1100px;
    margin-inline:auto;text-align:center}
  .wsp-hero__eyebrow{margin:0 0 1.25rem;font-size:.75rem;letter-spacing:.18em;
    text-transform:uppercase;opacity:.8}
  .wsp-hero__heading{margin:0;font-size:clamp(2.5rem,6.5vw,5rem);line-height:1.02;
    letter-spacing:-.035em;font-weight:700;
    text-shadow:0 2px 40px rgba(0,0,0,.5)}
  .wsp-hero__body{max-width:46ch;margin:1.5rem auto 0;font-size:1.0625rem;
    line-height:1.6;opacity:.85;text-shadow:0 1px 20px rgba(0,0,0,.6)}
  .wsp-hero__actions{display:flex;gap:.75rem;justify-content:center;margin-top:2.5rem}
  .wsp-hero__btn{display:inline-flex;align-items:center;padding:.9rem 1.75rem;
    border-radius:999px;font-size:.9375rem;font-weight:500;text-decoration:none}
  .wsp-hero__btn--primary{background:#fff;color:#05050A}
  .wsp-hero__btn--ghost{border:1px solid currentColor;color:inherit;opacity:.9}
  .wsp-wall__scrim{background:radial-gradient(ellipse 62% 48% at 50% 50%, rgba(5, 5, 10, 0.385) 0%, rgba(5, 5, 10, 0) 78%),linear-gradient(180deg, rgba(5, 5, 10, 0.560) 0%, rgba(5, 5, 10, 0.700) 45%, rgba(5, 5, 10, 0.560) 100%)}
  .wsp-wall__vignette{background:radial-gradient(ellipse 86% 84% at 50% 50%, rgba(5, 5, 10, 0) 55%, rgba(5, 5, 10, 0.55) 85%, #05050A 100%)}
  @media (max-width:749px){ .wsp-wall__vignette{background:radial-gradient(ellipse 125% 90% at 50% 50%, rgba(5, 5, 10, 0) 60%, rgba(5, 5, 10, 0.5) 88%, #05050A 100%)} }
  .after{min-height:180vh;display:grid;place-items:center;opacity:.35;
    border-top:1px solid rgba(255,255,255,.08)}

/* ---- extracted verbatim from snippets/website-wall.liquid ---- */
.wsp-wall {
    position: absolute;
    inset: 0;
    overflow: hidden;
    contain: layout paint;
    pointer-events: none;
    z-index: 0;
  }

  /* The stage is deliberately larger than the hero so the tilt never exposes
     a bare corner. Static transform; only the plane inside it animates. */
  .wsp-wall__stage {
    position: absolute;
    inset: -24%;
    transform: rotate(var(--wsp-tilt, -7deg));
  }

  /* A 2x2 tiling translated by exactly one tile per cycle: the final frame is
     identical to the first, so the loop never shows a seam. */
  .wsp-wall__plane {
    position: absolute;
    width: 200%;
    height: 200%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    animation: wsp-drift-ur var(--wsp-dur) linear infinite;
  }

  .wsp-wall--up_right .wsp-wall__plane { top: 0; left: -100%; }
  .wsp-wall--down_left .wsp-wall__plane {
    top: -100%;
    left: 0;
    animation-name: wsp-drift-dl;
  }

  .wsp-wall__tile {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .wsp-wall__card {
    position: absolute;
    left: calc(var(--x) * 1%);
    top: calc(var(--y) * 1%);
    width: calc(var(--w) * var(--wsp-size) * 1%);
    transform: translate(-50%, -50%) rotate(calc(var(--r) * var(--wsp-rot) * 1deg));
  }

  .wsp-wall__card img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: var(--ar, 1.55);
    object-fit: cover;
    border-radius: var(--wsp-radius);
    box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.75);
    opacity: var(--wsp-op);
    animation: wsp-breathe 26s ease-in-out var(--bd) infinite;
  }

  /* Depth is static: back cards read as further away without ever needing a
     second plane moving at a different speed. Opacity and blur live on the
     card, never on the plane, so the plane stays a plain transform container
     instead of a render surface several times the size of the viewport. */
  .wsp-wall__card--back img {
    opacity: calc(var(--wsp-op) * 0.6);
    filter: blur(calc(3px * var(--wsp-blur)));
  }
  .wsp-wall__card--mid img {
    opacity: calc(var(--wsp-op) * 0.82);
    filter: blur(calc(1.2px * var(--wsp-blur)));
  }

  .wsp-wall__scrim,
  .wsp-wall__vignette {
    position: absolute;
    inset: 0;
  }

  .wsp-wall--paused .wsp-wall__plane,
  .wsp-wall--paused .wsp-wall__card img {
    animation-play-state: paused;
  }

  .wsp-wall--still .wsp-wall__plane,
  .wsp-wall--still .wsp-wall__card img,
  .wsp-wall--nobreath .wsp-wall__card img {
    animation: none;
  }

  @keyframes wsp-drift-ur {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(50%, -50%, 0); }
  }

  @keyframes wsp-drift-dl {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-50%, 50%, 0); }
  }

  @keyframes wsp-breathe {
    0%, 100% { transform: scale(0.995); }
    50%      { transform: scale(1.005); }
  }

  /* Dropped to when the device cannot hold a smooth frame rate. */
  .wsp-wall--lite .wsp-wall__card--wide { display: none; }
  .wsp-wall--lite .wsp-wall__card img {
    filter: none;
    animation: none;
    box-shadow: 0 16px 36px -14px rgba(0, 0, 0, 0.7);
  }

  @media (max-width: 749px) {
    /* Phones fit far fewer cards, so they run bigger and sharper. */
    .wsp-wall__card--wide { display: none; }

    .wsp-wall__stage { inset: -32%; }

    .wsp-wall__card {
      width: calc(var(--w) * var(--wsp-size) * 1.45%);
    }

    .wsp-wall__card--back img { filter: blur(calc(1.5px * var(--wsp-blur))); }
    .wsp-wall__card--mid img { filter: none; }

    .wsp-wall__card img {
      box-shadow: 0 16px 36px -14px rgba(0, 0, 0, 0.65);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .wsp-wall__plane,
    .wsp-wall__card img {
      animation: none !important;
    }
  }
</style>
</head>

<script>

(function () {
    var REDUCED =
      window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function walls(root) {
      return (root || document).querySelectorAll('[data-wsp-wall]');
    }

    // 1. Park the animation whenever the wall is off-screen, so it costs
    //    nothing while the visitor reads the rest of the page.
    var observer =
      'IntersectionObserver' in window
        ? new IntersectionObserver(
            function (entries) {
              for (var i = 0; i < entries.length; i++) {
                entries[i].target.classList.toggle(
                  'wsp-wall--paused',
                  !entries[i].isIntersecting
                );
              }
            },
            { rootMargin: '150px' }
          )
        : null;

    function observeAll(root) {
      if (!observer) return;
      var list = walls(root);
      for (var i = 0; i < list.length; i++) observer.observe(list[i]);
    }

    // 2. Sample real frame times once, shortly after load. If this device
    //    cannot hold a smooth frame rate, drop to the lighter treatment
    //    rather than shipping a stuttering background.
    function probeFrameBudget() {
      if (REDUCED || !window.requestAnimationFrame) return;
      var samples = [];
      var last = 0;

      function tick(now) {
        if (last) samples.push(now - last);
        last = now;
        if (samples.length < 60) {
          requestAnimationFrame(tick);
          return;
        }
        samples.sort(function (a, b) { return a - b; });
        if (samples[Math.floor(samples.length / 2)] > 20) {
          var list = walls(document);
          for (var i = 0; i < list.length; i++) {
            list[i].classList.add('wsp-wall--lite');
          }
        }
      }

      requestAnimationFrame(tick);
    }

    observeAll(document);
    if (document.readyState === 'complete') {
      setTimeout(probeFrameBudget, 600);
    } else {
      window.addEventListener('load', function () {
        setTimeout(probeFrameBudget, 600);
      });
    }

    document.addEventListener('shopify:section:load', function (event) {
      observeAll(event.target);
    });
  })();
</script>
